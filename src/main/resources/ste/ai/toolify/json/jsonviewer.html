<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Viewer</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }
        #json-input {
            width: 100%;
            height: 200px;
            margin-bottom: 10px;
            font-family: monospace;
        }
        #output {
            background: #fff;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            min-height: 50px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>JSON Viewer</h1>
    
    <textarea id="json-input" placeholder="Paste your raw JSON here..."></textarea>
    
    <br>
    
    <button onclick="formatJSON()">Format JSON</button>
    
    <h3>Output:</h3>
    <div id="output">Formatted JSON will appear here...</div>

    <script>
        function formatJSON() {
            const input = document.getElementById('json-input').value;
            const outputDiv = document.getElementById('output');
            try {
                const parsed = JSON.parse(input);
                outputDiv.textContent = JSON.stringify(parsed, null, 4);
                outputDiv.style.color = "black";
            } catch (e) {
                outputDiv.textContent = "Error: Invalid JSON";
                outputDiv.style.color = "red";
            }
        }
    </script>

</body>
</html>
